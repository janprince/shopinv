{% load ui %}
<header class="mobile-bar no-print">
  <a class="brand" href="{% url 'core:dashboard' %}">
    <span class="brand-mark">{% icon "leaf" 18 %}</span>
    <span class="brand-name">{{ shop.shop_name }}</span>
  </a>
  <div class="spacer"></div>
  <button class="btn btn-quiet btn-icon btn-sm" type="button" data-bs-toggle="offcanvas"
          data-bs-target="#mobile-menu" aria-controls="mobile-menu" aria-label="Open menu">
    {% icon "menu" 18 %}
  </button>
</header>

<div class="offcanvas offcanvas-end" tabindex="-1" id="mobile-menu" aria-labelledby="mobile-menu-title">
  <div class="offcanvas-header border-bottom">
    <h2 class="offcanvas-title h6 m-0" id="mobile-menu-title">Menu</h2>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body p-2">
    {% include "partials/nav_links.html" %}
    <div class="mt-3 pt-3 border-top">
      <a class="user-chip mb-2" href="{% url 'accounts:profile' %}">
        <span class="avatar" aria-hidden="true">{{ request.user.initials }}</span>
        <span class="min-w-0">
          <span class="name d-block">{{ request.user.display_name }}</span>
          <span class="role">{{ request.user.get_role_display }}</span>
        </span>
      </a>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button class="btn btn-quiet btn-block" type="submit">{% icon "logout" 16 %} Sign out</button>
      </form>
    </div>
  </div>
</div>
