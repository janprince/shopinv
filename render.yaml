# Render blueprint. Create the services from this file with:
#   Render dashboard → New → Blueprint → point at this repository.

databases:
  - name: jcforganic-db
    databaseName: jcforganic
    user: jcforganic
    plan: basic-256mb          # enough for one shop; raise if the ledger grows
    postgresMajorVersion: "16"

services:
  - type: web
    name: jcforganic
    runtime: python
    plan: starter
    region: frankfurt          # closest Render region to Ghana
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 3 --threads 2 --timeout 60 --access-logfile - --error-logfile -"
    healthCheckPath: /healthz/
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: jcforganic-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true    # Render generates and stores this once
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DB_SSL_REQUIRE
        value: "true"
      - key: DJANGO_TIME_ZONE
        value: "Africa/Accra"
      - key: CURRENCY_SYMBOL
        value: "GH₵"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_LOG_LEVEL
        value: "INFO"
      # Set these once in the Render dashboard to have the first owner created
      # automatically on the first deploy, then clear OWNER_PASSWORD.
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
